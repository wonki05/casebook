<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>판례집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --serif:"Noto Serif KR","Noto Serif CJK KR","KoPubWorld Batang","KoPub Batang","Nanum Myeongjo","나눔명조","Batang","바탕","AppleMyungjo",Georgia,serif;
  --sans:"Noto Sans KR","Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Segoe UI",Roboto,sans-serif;
  --paper:#FBFAF7; --surface:#FFFFFF; --ink:#1B1A20; --ink-2:#5A5866; --ink-3:#8A8798;
  --rule:#E6E3EE; --rule-2:#D6D2E0; --accent:#5B3FA6; --accent-ink:#3F2B7A; --accent-soft:#F1EDF9;
  --mark:#F6E7A1; --fs:16px; --top:94px; --shadow:0 12px 40px rgba(30,20,60,.16); --lw-scroll-margin:72px;
}
@media(min-width:860px){:root{--top:52px}}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){ --paper:#16151B; --surface:#1D1C24; --ink:#ECEAF2; --ink-2:#A5A2B5; --ink-3:#7F7C8E;
    --rule:#2C2A38; --rule-2:#3A3748; --accent:#B7A6EC; --accent-ink:#CDC2F4; --accent-soft:#2A2344; --mark:#5A4A1E; --shadow:0 12px 40px rgba(0,0,0,.5); }
}
:root[data-theme=dark]{ --paper:#16151B; --surface:#1D1C24; --ink:#ECEAF2; --ink-2:#A5A2B5; --ink-3:#7F7C8E;
  --rule:#2C2A38; --rule-2:#3A3748; --accent:#B7A6EC; --accent-ink:#CDC2F4; --accent-soft:#2A2344; --mark:#5A4A1E; --shadow:0 12px 40px rgba(0,0,0,.5); }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;background:var(--accent);z-index:60}
body.cs-open{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:2px}
mark.cur{outline:2px solid var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--rule);
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;padding:3px 10px 0;min-height:var(--top)}
.tb-left,.tb-right{display:flex;align-items:center;gap:2px;min-height:48px;grid-row:1}
.tb-left{grid-column:1}.tb-right{grid-column:3;justify-content:flex-end}
.ibtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--ink-2)}
.ibtn:hover{background:var(--accent-soft);color:var(--accent-ink)}
.ibtn.on{color:var(--accent)}
.brand{font:700 16px/1 var(--sans);letter-spacing:.02em;padding:0 6px 0 2px;color:var(--ink)}
.pagetabs{grid-column:1/-1;grid-row:2;display:flex;align-items:stretch;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -10px;padding:0 10px}
.pagetabs::-webkit-scrollbar{display:none}
.pagetabs .sec{display:flex;align-items:stretch;gap:2px;position:relative;padding-right:8px;margin-right:8px}
.pagetabs .sec::after{content:"";position:absolute;right:0;top:12px;bottom:14px;width:1px;background:var(--rule-2)}
.pagetabs .sec:last-child::after{display:none}
.pagetabs .sec-l{display:none;white-space:nowrap}
.pagetabs button{white-space:nowrap;padding:9px 8px 11px;font:500 14px/1 var(--sans);color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.pagetabs button[aria-current=page]{color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.pagetabs .l{display:none}
@media(min-width:1440px){.pagetabs .l{display:inline}.pagetabs .s{display:none}}
@media(min-width:860px){
  .topbar{grid-template-columns:auto 1fr auto;padding:3px 16px 0}
  .pagetabs{grid-column:2;grid-row:1;justify-content:flex-start;gap:4px;margin:0;padding:0}
  .pagetabs .sec:first-child{margin-left:auto}.pagetabs .sec:last-child{margin-right:auto}
  .pagetabs .sec{padding:0 12px 0 0;margin-right:10px;align-items:center}
  .pagetabs .sec::after{top:16px;bottom:16px}
  .pagetabs .sec-l{display:inline-block;font:500 10.5px/1 var(--sans);letter-spacing:.08em;color:var(--ink-3);padding:0 6px 0 2px;align-self:center;position:relative;top:1px;transform:scaleX(.95);transform-origin:left center}
  .pagetabs button{padding:17px 7px 15px}
}
@media(min-width:860px) and (max-width:1179px){.pagetabs .sec-l{display:none;white-space:nowrap}}

/* column */
.column{max-width:720px;margin:0 auto;padding:26px 20px calc(72px + env(safe-area-inset-bottom))}
.column.wide{max-width:1180px}
.runhead{font:500 12px/1.4 var(--sans);letter-spacing:.06em;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 6px;margin:0 0 16px}
.runhead b{font-weight:600;color:var(--ink-2)}
.pagehead h1{font:700 26px/1.3 var(--sans);margin:0 0 6px;letter-spacing:-.01em}
.pagehead p{margin:0;color:var(--ink-2);font-size:14px}
.pagehead-laws{margin:0 0 34px}
.pagehead-laws h1{margin-bottom:0}
.maxim{margin:22px 0 8px;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.maxim i{font:italic 400 14px var(--serif);color:var(--accent-ink)}
.maxim span{font:400 12.5px var(--sans);color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 4px}
.chip{font:500 12.5px/1 var(--sans);padding:7px 11px;border:1px solid var(--rule-2);border-radius:999px;color:var(--ink-2)}
.chip[aria-pressed=true]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.chip small{font:500 11px/1 var(--sans);color:var(--accent-ink);margin-left:4px}

/* 법률신문 주요판례: 연도 버튼(여러 개 선택) · 필터 · 찾기 */
.abar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0 0}
.years{flex:1 1 0;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.years::-webkit-scrollbar{display:none}
.years.fade-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent)}
.years.fade-l{-webkit-mask-image:linear-gradient(to right,transparent,#000 32px);mask-image:linear-gradient(to right,transparent,#000 32px)}
.years.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 32px,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to right,transparent,#000 32px,#000 calc(100% - 32px),transparent)}
.yr{flex:none;scroll-snap-align:start;height:34px;padding:0 13px;border:1px solid var(--rule-2);border-radius:999px;font:600 13.5px/32px var(--sans);color:var(--ink-2);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.yr.none{color:var(--ink-3);font-weight:500}
.yr:hover{border-color:var(--accent)}
.yr[aria-pressed=true]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);font-weight:700}
.atools{flex:none;display:flex;align-items:center;gap:6px}
.abtn{position:relative;height:34px;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 11px;border:1px solid var(--rule-2);border-radius:8px;font:500 13px var(--sans);color:var(--ink-2);white-space:nowrap}
.abtn .ic{width:16px;height:16px}
.abtn:hover,.abtn[aria-expanded=true],.abtn.on{border-color:var(--accent);color:var(--accent-ink)}
.abtn .bn{min-width:17px;height:17px;border-radius:999px;background:var(--accent);color:var(--paper);font:700 11px/17px var(--sans);text-align:center;padding:0 4px}
#btnAFind{display:none;width:34px;padding:0}
.afind{flex:0 0 184px;position:relative;display:flex;align-items:center;min-width:0}
.afind .ic{position:absolute;left:9px;width:16px;height:16px;color:var(--ink-3);pointer-events:none}
.afind input{flex:1;min-width:0;width:100%;height:34px;border:1px solid var(--rule-2);border-radius:8px;padding:0 10px 0 31px;font:400 13.5px var(--sans);color:var(--ink);background:var(--surface)}
.afind input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
@media(max-width:599px){
  #btnAFind{display:inline-flex}
  .afind{display:none;order:3;flex:1 1 100%}
  .abar.find-open .afind{display:flex}
}
.afilter{margin:10px 0 0;padding:4px 14px 10px;border:1px solid var(--rule);border-radius:12px;background:var(--surface)}
.afilter[hidden]{display:none}
.afilter .fg{display:flex;gap:4px 12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--rule)}
.afilter .fl{flex:none;width:2.6em;font:600 12px/30px var(--sans);color:var(--ink-3);letter-spacing:.04em}
.afilter .chips{margin:0;flex:1;min-width:0}
.afilter .ffoot{display:flex;justify-content:flex-end;gap:6px;padding-top:10px}
@media(max-width:599px){.afilter .fg{flex-direction:column;gap:2px}.afilter .fl{width:auto;line-height:1.6}}
.astat{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin:12px 0 0;font:400 12.5px/1.6 var(--sans);color:var(--ink-3)}
.astat b{font-weight:600;color:var(--ink-2)}
.astat .lk{font:500 12.5px/1.6 var(--sans);color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px}
.annual-note{margin:18px 0 0;padding:16px 18px;border:1px dashed var(--rule-2);border-radius:10px;color:var(--ink-2);font-size:14px}
/* 헌법재판소 주요결정·대법원 전원합의체: 과목 칩 아래 선고연도 탭(전체연도 + 연도·연대 여러 개 선택) — 넓은 화면은 줄바꿈, 좁은 화면은 가로로 밀기 */
.ytabs{display:flex;align-items:flex-start;gap:6px;margin:10px 0 0}
@media(min-width:600px){.years.wrap{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none}}

/* book-style table of contents (in column) */
.toc{margin:14px 0 0}
.toc details{margin:0}
.toc summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:9px 0;font:600 15px/1.4 var(--sans)}
.toc summary::-webkit-details-marker{display:none}
.toc summary .tri{width:9px;flex:none;color:var(--ink-3);font-size:10px;transform:translateY(-1px)}
.toc details[open]>summary .tri{transform:rotate(90deg) translateX(-1px)}
.toc summary .lead{flex:1;border-bottom:1px dotted var(--rule-2);transform:translateY(-5px);margin:0 6px;min-width:12px}
.toc summary .cnt{font:500 12px/1 var(--sans);color:var(--ink-3);min-width:1.5em;text-align:right}
.toc .lv1>summary{font-size:16px;margin-top:14px;border-bottom:1px solid var(--rule)}
.toc.annual .lv1.empty>summary{color:var(--ink-3);font-weight:500}
.toc summary .fsub{font:500 12px/1 var(--sans);color:var(--accent-ink)}
.toc .lv2>summary{font-size:14.5px;color:var(--ink);padding-left:14px}
.toc .lv2.empty>summary{color:var(--ink-3);font-weight:400}
.toc .lv3>summary{font-size:14px;color:var(--ink);padding-left:28px}
.toc .lv3.empty>summary{color:var(--ink-3);font-weight:400}
.toc .empty-note{padding:2px 0 8px 28px;font-size:12px;color:var(--ink-3)}
.entries{margin:0;padding:0;list-style:none}
.entry{display:flex;align-items:stretch;border-radius:8px}
.entry.cur{background:var(--accent-soft)}
.entry-main{flex:1;min-width:0;display:block;padding:9px 8px 10px 14px}
.lv2 .entries .entry-main{padding-left:28px}
.lv3 .entries .entry-main{padding-left:42px}
.toc .lv3 .empty-note{padding-left:42px}
.flat .entries .entry-main{padding-left:14px}
.flat .lv2 .entries .entry-main{padding-left:28px}
.flat .lv1>.empty-note{padding-left:14px}
.entry-main:hover{background:var(--accent-soft)}
.entry .t{font:500 14.5px/1.45 var(--sans);color:var(--ink);display:block}
.entry .m{display:flex;align-items:flex-start;gap:6px;font:400 12.5px/1.5 var(--sans);color:var(--ink-3);margin-top:5px}
.entry .m .court-ic{width:18px;height:18px;margin-top:1px}
.entry .m .ct{flex:1;min-width:0}
.entry .m .res{color:var(--accent-ink);white-space:nowrap;padding-left:8px}
.entry .m .pg{color:var(--ink-3)}
.star{width:40px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink-3);border-radius:8px}
.star .ic{width:17px;height:17px}
.star.on{color:var(--accent)}
.star.on .ic{fill:var(--accent)}

/* ===== case sheet ===== */
.cs{position:fixed;inset:0;z-index:75;display:none}
.cs.show{display:block}
.cs .bg{position:absolute;inset:0;background:rgba(20,16,36,.42);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.cs .box{position:absolute;top:0;bottom:0;right:0;left:0;background:var(--paper);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media(min-width:1024px){
  .cs .box{left:auto;width:var(--sheet-w,min(680px,60vw));max-width:calc(100vw - 120px);box-shadow:var(--shadow);border-left:1px solid var(--rule);transform:translateX(24px);opacity:0;transition:transform .22s ease,opacity .22s ease}
  .cs.show .box{transform:none;opacity:1}
  .cs.dragging .box{transition:none}
  .cs-handle{position:absolute;top:0;bottom:0;right:calc(var(--sheet-w,min(680px,60vw)) - 4px);width:9px;cursor:col-resize;z-index:2;touch-action:none}
  .cs-handle::after{content:"";position:absolute;left:4px;top:0;bottom:0;width:3px;background:transparent;transition:background .15s}
  .cs-handle:hover::after,.cs.dragging .cs-handle::after{background:var(--accent)}
  .cs.full .box{width:100%!important;max-width:none;left:0;border-left:0}
  .cs.full .cs-handle{display:none}
}
body.cs-drag{user-select:none;-webkit-user-select:none;cursor:col-resize}
.cs-handle{display:none}
@media(min-width:1024px){.cs-handle{display:block}}
#btnCsFull{display:none}
@media(min-width:1024px){#btnCsFull{display:inline-flex}}
.cs-bar{position:sticky;top:0;z-index:6;background:var(--paper);display:flex;align-items:center;gap:6px;padding:0 8px 0 6px;border-bottom:1px solid var(--rule);height:52px}
.cs-bar .crumb{flex:1;min-width:0;font:500 12.5px/1.4 var(--sans);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.cs-bar .crumb b{color:var(--ink-2);font-weight:600}
.cs-body{padding:18px 20px calc(34px + env(safe-area-inset-bottom));display:flex;gap:28px;align-items:flex-start}
@media(min-width:1024px){.cs-body{padding:22px 28px 40px}}
.cs-main{flex:1 1 0;min-width:0}
.cs.full .cs-body{max-width:1180px;margin:0 auto;justify-content:center}
.cs.full .cs-main{max-width:880px}
/* ===== outlines (노션식 개요) ===== */
.outline{font-family:var(--sans);font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.outline .outline-h{font:600 11px/1.4 var(--sans);letter-spacing:.08em;color:var(--ink-3);margin:0 0 8px}
.outline ul{list-style:none;margin:0;padding:0}
.outline li{margin:0}
.outline a{display:block;padding:4px 8px 4px 10px;border-left:2px solid transparent;color:var(--ink-2);border-radius:0 6px 6px 0;overflow-wrap:anywhere}
.outline a:hover{background:var(--accent-soft);color:var(--accent-ink)}
.outline a.cur{color:var(--accent-ink);font-weight:700;border-left-color:var(--accent)}
.outline .lw-toc .tg{display:none}
.outline .lw-toc li>ul{display:block}
.outline .lw-toc .row{display:block}
.outline .lw-toc a{font:inherit;padding:4px 8px 4px 10px;border-left:2px solid transparent;border-radius:0 6px 6px 0}
.outline .lw-toc a.cur{color:var(--accent-ink);font-weight:700;border-left-color:var(--accent)}
.outline .lw-toc .l1>.row a{font-weight:600;color:var(--ink)}
.outline .lw-toc .l1>.row a.cur{color:var(--accent-ink)}
.outline .lw-toc .l2>.row{padding-left:10px}.outline .lw-toc .l3>.row{padding-left:22px}.outline .lw-toc .l4>.row{padding-left:34px}
.outline .lw-toc .l3>.row a,.outline .lw-toc .l4>.row a{font-size:12px}
.outline .lw-toc .supp a{color:var(--ink-3)}
.outline.pop{position:fixed;top:calc(var(--top) + 10px);right:12px;width:min(320px,88vw);max-height:min(70vh,560px);overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:12px 12px 10px;z-index:66}
.ft-outline{display:none;flex:0 0 212px}
.cs.wide .ft-outline.has{display:block;position:sticky;top:64px;align-self:flex-start;max-height:calc(100vh - 84px);overflow:auto;padding:4px 0 4px 12px;border-left:1px solid var(--rule);scrollbar-width:thin}
.ft-outline.pop.has{display:block;flex:none;z-index:66}
.cs.full .ft-outline.has{display:block}
.ol-btn{display:none;align-items:center;gap:5px;margin-left:auto;padding:0 10px;height:32px;align-self:center;border:1px solid var(--rule-2);border-radius:8px;font:500 12.5px var(--sans);color:var(--ink-2);white-space:nowrap}
.ol-btn .ic{width:15px;height:15px}
.cs.has-ol:not(.wide) .ol-btn{display:inline-flex}
.cs.full .ol-btn{display:none}
.outline-btn{display:none;align-items:center;gap:5px;position:fixed;right:14px;top:calc(var(--top) + 10px);height:34px;padding:0 11px;border:1px solid var(--rule-2);border-radius:8px;font:500 12.5px var(--sans);color:var(--ink-2);background:var(--surface);box-shadow:0 2px 10px rgba(30,20,60,.08);z-index:38}
.law-outline.pop{top:calc(var(--top) + 50px)}
.outline-btn .ic{width:15px;height:15px}
@media(max-width:1179px){.outline-btn{display:inline-flex}}

/* case reader */
.case h1{font:700 23px/1.35 var(--sans);margin:0 0 4px;letter-spacing:-.01em}
.casename{margin:0 0 12px;color:var(--ink-2);font-size:13.5px;line-height:1.5}
.cite{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;font:500 14px/1.5 var(--sans);color:var(--ink);padding:8px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.cite-main{display:flex;align-items:center;gap:10px;flex:1 1 300px;min-width:0;padding:4px 0}
.cite-main .court-ic{width:24px;height:24px}
.cite-sub{display:flex;align-items:center;gap:6px;margin-left:auto}
.badge{font:500 11.5px/1 var(--sans);padding:5px 8px;border:1px solid var(--rule-2);border-radius:999px;color:var(--accent-ink);white-space:nowrap}
.badge.sub{color:var(--ink-2)}
.cite .acts{display:flex;gap:2px;margin-left:4px}
.cite .ibtn{width:40px;height:40px}
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--rule);margin:14px 0 0;position:sticky;top:52px;background:var(--paper);z-index:5;overflow-x:auto;scrollbar-width:none;height:38px;box-shadow:0 1px 0 var(--paper);align-items:stretch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:11px 2px;font:500 14px/1 var(--sans);color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.sec h3{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px;font:700 14.5px/1.3 var(--sans);color:var(--accent-ink)}
.sec:first-child h3{margin-top:18px}
#tabpanel>.sec:first-child h3{margin-top:18px}
.sec h3 .num{font:600 13px/1 var(--serif);color:var(--accent);letter-spacing:.08em;min-width:1.4em}
.sec h3 .sub{font:400 12px var(--sans);color:var(--ink-3);margin-left:auto}
.serif{font-family:var(--serif);font-size:var(--fs);line-height:1.85;word-break:keep-all;overflow-wrap:anywhere;color:var(--ink)}
.items{list-style:none;margin:0;padding:0}
.items li{display:grid;grid-template-columns:max-content 1fr;column-gap:.6em;margin:0 0 .9em}
.items li.nolabel{grid-template-columns:1fr}
.items .n{font-family:var(--sans);font-weight:600;min-width:2.1em;color:var(--accent-ink);font-size:calc(var(--fs) - 1px);line-height:1.85}
.items .t{font-family:var(--serif)}
.items .t p{margin:0 0 .55em}
.items .t p:last-child{margin-bottom:0}
.lines{margin:0;padding:0;list-style:none}
.lines li{margin:0 0 .35em;padding-left:1.2em;text-indent:-1.2em}
.note{margin:14px 0 0;font:400 12.5px/1.5 var(--sans);color:var(--ink-3)}
.src{margin:34px 0 0;padding-top:12px;border-top:1px solid var(--rule);font:400 12px/1.5 var(--sans);color:var(--ink-3);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.src a{color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.related{margin:0;padding:0;list-style:none}
.related li{border-bottom:1px solid var(--rule)}
.related a{display:block;padding:11px 6px 12px;border-radius:8px}
.related a:hover{background:var(--accent-soft)}
.related .t{display:block;font:500 14.5px/1.45 var(--sans);color:var(--ink)}
.related .m{display:flex;align-items:flex-start;gap:6px;margin-top:5px;font:400 12.5px/1.5 var(--sans);color:var(--ink-3)}
.related .m .court-ic{width:18px;height:18px;margin-top:1px}
.related .k{display:block;margin-top:3px;font:400 12.5px/1.5 var(--sans);color:var(--ink-3)}
.related .k em{font-style:normal;color:var(--accent-ink)}
.empty-ft{margin:26px 0;padding:18px;border:1px dashed var(--rule-2);border-radius:10px;color:var(--ink-2);font-size:14px}
/* full text */
.findbar{position:sticky;top:90px;z-index:4;background:var(--paper);display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--rule);margin-bottom:8px}
.findbar input{flex:1;min-width:0;height:38px;border:1px solid var(--rule-2);border-radius:8px;padding:0 10px;font:400 14px var(--sans);color:var(--ink);background:var(--surface)}
.findbar input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.findbar .cnt{font:400 12.5px var(--sans);color:var(--ink-3);white-space:nowrap;min-width:3em;text-align:center}
.findbar .ibtn{width:36px;height:36px}
.ft{line-height:1.9;letter-spacing:-.01em;width:101.0101%;transform:scaleX(.99);transform-origin:0 0}
.ft h4{font:700 14.5px/1.4 var(--sans);margin:28px 0 12px;color:var(--accent-ink)}
.ft h4:first-child{margin-top:6px}
.ft p{margin:0 0 .75em;padding-left:0;text-indent:0;text-align:left}
.ft .head p{text-align:left}
.ft .ln{display:grid;grid-template-columns:max-content 1fr;column-gap:12px;align-items:baseline;margin:0 0 6px;text-align:left}
.ft .ln b{font:600 14.5px/1.6 var(--sans);color:var(--ink);white-space:nowrap}
.ft .ln+h4{margin-top:24px}
.ft p.hd{font-family:var(--sans);font-weight:600;text-indent:0;text-align:left;margin:1.4em 0 .4em;color:var(--ink);line-height:1.5}
.ft p.hd.h1{font-size:15.5px;margin-top:1.8em}
.ft p.hd:first-child{margin-top:.2em}
.ft .order p.np{display:grid;grid-template-columns:max-content 1fr;column-gap:.5em;text-indent:0}
.ft .order p.np .mk{font-family:var(--sans);font-weight:600;color:var(--ink-2);font-size:.92em;line-height:1.9}
.progress{position:fixed;left:0;top:3px;height:2px;background:var(--accent);width:0;z-index:61;transition:width .1s linear;opacity:.8}
/* memo */
.memo textarea{width:100%;min-height:260px;resize:vertical;border:1px solid var(--rule-2);border-radius:10px;padding:14px;font:400 15px/1.7 var(--sans);color:var(--ink);background:var(--surface)}
.memo textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.memo .st{font:400 12.5px var(--sans);color:var(--ink-3);margin-top:8px;display:flex;justify-content:space-between}
/* prev / next */
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:42px 0 0;padding-top:16px;border-top:1px solid var(--rule)}
.pn a,.pn .dis{display:block;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;min-height:64px;background:var(--surface)}
.pn a:hover{border-color:var(--accent)}
.pn .lbl{font:500 11.5px/1 var(--sans);color:var(--ink-3);letter-spacing:.05em;display:block;margin-bottom:6px}
.pn .t{font:500 13.5px/1.4 var(--sans);color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pn .next{text-align:right}
.pn .dis{opacity:.5}

/* ===== laws page layout ===== */
.laws{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.laws-top{min-width:0}
.laws-top{display:flex;gap:8px;align-items:center;margin:0 0 4px}
.laws-top select{flex:1;min-width:0;height:42px;border:1px solid var(--rule-2);border-radius:10px;padding:0 10px;font:500 14px var(--sans);color:var(--ink);background:var(--surface)}
.laws-top .tbtn{height:42px;padding:0 14px;border:1px solid var(--rule-2);border-radius:10px;font:500 14px var(--sans);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.laws-side{display:none}
.laws-body{display:flex;gap:clamp(34px,2.6vw,56px);align-items:flex-start;min-width:0}   /* 본문 ↔ 오른쪽 개요: 최소 34px(기존 28px의 120%), 화면 폭에 따라 최대 56px */
.laws-main{flex:1 1 0;min-width:0;max-width:760px;position:relative}
.law-outline{display:none;flex:0 0 212px}
@media(min-width:1180px){.law-outline{display:block;position:sticky;top:calc(var(--top) + 16px);max-height:calc(100vh - var(--top) - 32px);overflow:auto;padding:4px 0 4px 12px;border-left:1px solid var(--rule);scrollbar-width:thin}}
.law-outline.pop{display:block;flex:none}

  .laws{grid-template-columns:272px minmax(0,1fr);gap:clamp(38px,2.9vw,60px);align-items:start}   /* 왼쪽 법령 목록 ↔ 본문: 최소 38px(기존 32px의 120%), 화면 폭에 따라 최대 60px */
  .laws-top{display:none}
  .laws-side{display:block;position:sticky;top:calc(var(--top) + 16px);max-height:calc(100vh - var(--top) - 32px);overflow:auto;padding-right:6px;scrollbar-width:thin}
  .laws-nav .lw-index{margin-bottom:0}
}
.laws-nav .nav-h{font:600 11.5px/1.4 var(--sans);letter-spacing:.08em;color:var(--ink-3);margin:6px 0 8px}
/* host overrides for the module's tool row on narrow screens */
.laws-main .lw-tools{row-gap:10px}
.laws-main .lw-tools label{flex:1 1 100%;min-width:0;flex-wrap:nowrap}
.laws-main .lw-tools label>span{white-space:nowrap}
.laws-main .lw-tools select{flex:1;min-width:0;width:100%}
.laws-main .lw-tools input{flex:1;min-width:0;width:auto}
@media(min-width:700px){.laws-main .lw-tools label{flex:0 1 auto}.laws-main .lw-tools select{width:auto;max-width:460px}.laws-main .lw-tools input{flex:none;width:9em}.laws-main .lw-tools input.find{width:12em}}

/* slide-in panel */
.scrim{position:fixed;inset:0;background:rgba(20,16,36,.42);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;bottom:0;left:0;width:min(380px,92vw);background:var(--paper);z-index:80;transform:translateX(-102%);transition:transform .24s ease;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:3px}
.panel.show{transform:none}
.panel-head{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 16px;border-bottom:1px solid var(--rule);min-height:52px}
.panel-head strong{font:700 16px var(--sans);flex:1}
.panel-body{overflow:auto;flex:1;padding:8px 10px calc(20px + env(safe-area-inset-bottom)) 10px}
.pages{list-style:none;margin:0 0 8px;padding:0 0 8px;border-bottom:1px solid var(--rule)}
.pages .ph{font:600 11.5px/1.4 var(--sans);letter-spacing:.08em;color:var(--ink-3);padding:10px 10px 4px}
.pages a{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;font:500 14.5px var(--sans)}
.pages a .cnt{margin-left:auto;font-size:12px;color:var(--ink-3)}
.pages a.cur{background:var(--accent-soft);color:var(--accent-ink)}
.panel .toc .lv1>summary{font-size:14.5px;margin-top:8px}
.panel .toc .lv2>summary{font-size:13.5px}
.panel .entry .t{font-size:13.5px}

.panel .years{margin:12px 2px 4px}

.res .k .g{color:var(--ink-3)}
.res .t{font:500 14.5px/1.45 var(--sans);margin:5px 0 4px}

.seg{display:flex;border:1px solid var(--rule-2);border-radius:10px;overflow:hidden}

.rng input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:32px}
.rng .lb{font:400 12.5px var(--sans);color:var(--ink-3);white-space:nowrap}
.rng .pv{display:flex;gap:6px;align-items:center}
.rng .pv .court-ic{width:26px;height:26px}
.keys{font:400 13px/1.8 var(--sans);color:var(--ink-2);margin:0;padding:0;list-style:none;columns:2;column-gap:20px}
.keys kbd{font:500 12px var(--sans);border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink);background:var(--surface)}
.bluelight{position:fixed;inset:0;pointer-events:none;z-index:9999;background:#ff9a2e;mix-blend-mode:multiply;opacity:0}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font:500 13.5px var(--sans);opacity:0;transition:.2s;z-index:120;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
@media print{

.lw-index button[aria-current=true]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}

.lw-head{font-family:var(--sans);border-bottom:1px solid var(--rule);padding:0 0 14px;margin:0 0 18px}
.lw-head .kicker{font:500 12.5px/1.4 var(--sans);color:var(--accent-ink);letter-spacing:.04em;margin:0 0 4px}
.lw-head h1{margin:0 0 6px;font:700 26px/1.25 var(--sans);letter-spacing:-.01em}
.lw-head .meta{font:400 13px/1.6 var(--sans);color:var(--ink-2)}
.lw-head .meta b{font-weight:600;color:var(--ink)}
.lw-head .old{margin:8px 0 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);font-size:13px;color:var(--accent-ink);border-radius:0 8px 8px 0}
.lw-tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;align-items:center}
.lw-tools label{display:flex;align-items:center;gap:6px;font:500 13px/1 var(--sans);color:var(--ink-2)}
.lw-tools select,.lw-tools input{font:400 14px/1.2 var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--rule-2);border-radius:8px;padding:8px 10px;min-height:38px}
.lw-tools select{max-width:100%}
.lw-tools input{width:9em}
.lw-tools input.find{width:12em}
.lw-tools .cnt{font-size:12.5px;color:var(--ink-3)}
.lw-tools .ver{font-weight:600;color:var(--accent-ink)}

.lw-toc{font-family:var(--sans)}
.lw-toc ul{list-style:none;margin:0;padding:0}
.lw-toc li{margin:0}
.lw-toc .row{display:flex;align-items:center;gap:4px}
.lw-toc .tg{width:22px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);flex:none}
.lw-toc .tg svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;transition:transform .15s}
.lw-toc li.open>.row .tg svg{transform:rotate(90deg)}
.lw-toc .tg.none{visibility:hidden}
.lw-toc a{flex:1;display:block;padding:5px 8px 5px 2px;border-radius:6px;font:500 13.5px/1.4 var(--sans);color:var(--ink-2);text-decoration:none}
.lw-toc a:hover{background:var(--accent-soft);color:var(--accent-ink)}
.lw-toc a.cur{color:var(--accent-ink);font-weight:700}
.lw-toc .l1>.row a{font-weight:700;color:var(--ink)}
.lw-toc .l2>.row{padding-left:10px}.lw-toc .l3>.row{padding-left:26px}.lw-toc .l4>.row{padding-left:42px}
.lw-toc .l3>.row a,.lw-toc .l4>.row a{font-size:13px}
.lw-toc li>ul{display:none}.lw-toc li.open>ul{display:block}
.lw-toc .supp a{color:var(--ink-3)}

.lw-text{font-family:var(--serif);font-size:var(--fs,16px);line-height:1.9;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.01em;width:101.0101%;transform:scaleX(.99);transform-origin:0 0}
.lw-text .pre{margin:0 0 26px;padding:14px 18px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.lw-text .pre h3{margin:0 0 6px;font:700 13px/1.4 var(--sans);letter-spacing:.1em;color:var(--accent-ink)}
.lw-text .pre p{margin:0;text-align:left}
.lw-text h2.lw-h{font-family:var(--sans);margin:34px 0 12px;padding:0 0 8px;border-bottom:1px solid var(--rule);color:var(--ink);scroll-margin-top:var(--lw-scroll-margin,72px)}
.lw-text h2.lw-h.l1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin-top:40px}
.lw-text h2.lw-h.l2{font-size:17px;font-weight:700}
.lw-text h2.lw-h.l3{font-size:15px;font-weight:600;border-bottom:0;color:var(--ink-2);padding-bottom:0}
.lw-text h2.lw-h.l4{font-size:14px;font-weight:600;border-bottom:0;color:var(--ink-3);padding-bottom:0;margin-top:22px}
.lw-text h2.lw-h:first-child{margin-top:0}
.lw-art{margin:0 0 22px;scroll-margin-top:var(--lw-scroll-margin,72px)}
.lw-art.hit{box-shadow:inset 3px 0 0 var(--accent);padding-left:12px;margin-left:-15px;border-radius:0}
.lw-art.hide{display:none}
.lw-art-h{margin:0 0 4px;font:700 15px/1.5 var(--sans);color:var(--ink)}
.lw-art-h .no{color:var(--accent-ink)}
.lw-art-h .t{margin-left:6px;font-weight:600;color:var(--ink-2)}
.lw-art-b p{margin:0 0 .25em;display:grid;grid-template-columns:max-content 1fr;column-gap:.5em;text-align:left}
.lw-art-b p.pl{display:block}
.lw-art-b p .m{font-family:var(--sans);font-weight:600;color:var(--ink-2);font-size:.92em;line-height:1.9;min-width:1.2em}
.lw-art-b p.ho{padding-left:1.4em}.lw-art-b p.mok{padding-left:2.9em}.lw-art-b p.sub{padding-left:4.3em}
.lw-art-b p.del{color:var(--ink-3);display:block}
.lw-art-b p.note{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);display:block;margin-top:.3em}
.lw-art-b pre.tbl{font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin:.4em 0}
.lw-supp{margin:40px 0 0;border-top:1px solid var(--rule);padding-top:14px;font-family:var(--serif)}
.lw-supp summary{cursor:pointer;font:700 15px/1.5 var(--sans);color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:8px}
.lw-supp summary::-webkit-details-marker{display:none}
.lw-supp summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-left:4px}
.lw-supp[open] summary::before{transform:rotate(45deg)}
.lw-supp h3{margin:22px 0 6px;font:600 14px/1.4 var(--sans);color:var(--ink-2)}
.lw-supp p{margin:0 0 .3em;text-align:left}
.lw-supp p.ho{padding-left:1.4em}.lw-supp p.mok{padding-left:2.9em}
.lw-empty{padding:40px 0;color:var(--ink-3);font-family:var(--sans);text-align:center}
.lw-src{margin:28px 0 0;font:400 12.5px/1.5 var(--sans);color:var(--ink-3)}
@media print{.lw-tools,.lw-toc{display:none}}
</style>

<script id="laws-js">
window.LawsModule = (() => {
  let DATA = null, loading = null;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const CHEV = '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';

  async function load(){
    if (DATA) return DATA;
    if (loading) return loading;
    loading = (async () => {
      if (window.CASEBOOK_WEB) { DATA = await window.CasebookData.loadLaws(); return DATA; }
      const el = document.getElementById('laws-data');
      if (!el) throw new Error('laws-data 없음');
      const b64 = el.textContent.trim();
      if (!b64 || b64.startsWith('__')) throw new Error('법령 데이터가 비어 있습니다 (빌드 필요)');
      if (typeof DecompressionStream === 'undefined') throw new Error('이 브라우저는 압축 데이터를 풀 수 없습니다 (DecompressionStream 미지원)');
      const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
      const text = await new Response(stream).text();
      DATA = JSON.parse(text);
      return DATA;
    })();
    try { return await loading; } finally { loading = null; }
  }
  const lawById = id => DATA && DATA.laws.find(l => l.id === id);
  function versionOf(law, versionId){
    if (!law.versions) return null;
    return law.versions.find(v => v.id === versionId) || law.versions.find(v => v.current) || law.versions[0];
  }
  const fmtDate = s => { const m = String(s || '').match(/(\d{4})[.\-]\s*(\d{1,2})[.\-]\s*(\d{1,2})/); return m ? `${m[1]}. ${+m[2]}. ${+m[3]}.` : String(s || ''); };

  function indexHtml(activeLawId){
    if (!DATA) return '';
    return DATA.groups.map(g => {
      const laws = DATA.laws.filter(l => l.group === g.id);
      if (!laws.length) return '';
      return `<div class="g"><h4>${esc(g.label)}</h4>${laws.map(l => `<button type="button" data-law="${esc(l.id)}" aria-current="${l.id === activeLawId}">${esc(l.name)}<span class="k">${(l.versions ? (l.versions.find(v => v.current) || l.versions[0]).articles.length : l.articles.length) + '개조'}</span></button>`).join('')}</div>`;
    }).join('');
  }

  const artSlug = (lawKey, no) => `${lawKey}-art-${no.replace(/[^0-9의]/g, '')}`;
  function normNo(q){
    q = String(q || '').trim().replace(/\s+/g, '');
    if (!q) return '';
    const m = q.match(/^(?:제)?(\d+)(?:조)?(?:의(\d+))?(?:조)?$/);
    if (!m) return q;
    return `제${m[1]}조${m[2] ? '의' + m[2] : ''}`;
  }

  function lineHtml([m, t]){
    if (m === 'T') return `<pre class="tbl">${esc(t)}</pre>`;
    if (m === 'X') return `<p class="del">${esc(t)}</p>`;
    if (m === 'N') return `<p class="note">${esc(t)}</p>`;
    if (!m) return `<p class="pl">${esc(t)}</p>`;
    let cls = 'hang';
    if (/^\d+(의\d+)?\.$/.test(m)) cls = 'ho';
    else if (/^[가-힣](의\d+)?\.$/.test(m)) cls = 'mok';
    else if (/^\(?\d+\)$|^[가-힣]\)$/.test(m)) cls = 'sub';
    return `<p class="${cls}"><span class="m">${esc(m)}</span><span class="x">${esc(t)}</span></p>`;
  }
  function articleHtml(lawKey, a){
    return `<article class="lw-art" id="${artSlug(lawKey, a.no)}" data-no="${esc(a.no)}"><h4 class="lw-art-h"><span class="no">${esc(a.no)}</span>${a.t ? `<span class="t">(${esc(a.t)})</span>` : ''}</h4><div class="lw-art-b">${a.b.map(lineHtml).join('')}</div></article>`;
  }
  // --- progressive text rendering: pieces (heading+article html) appended in chunks so big laws paint fast ---
  const CHUNK = 60;
  const pending = new WeakMap();   // textEl -> {pieces, i, tail, token}
  function buildPieces(law, body, lawKey){
    const pieces = [];
    const toc = body.toc || []; let ti = 0;
    const arts = body.articles || [];
    for (let i = 0; i < arts.length; i++){
      let h = '';
      while (ti < toc.length && toc[ti].a <= i){ const t = toc[ti++]; h += `<h2 class="lw-h l${t.l}" id="${esc(t.id)}">${esc(t.t)}</h2>`; }
      pieces.push(h + articleHtml(lawKey, arts[i]));
    }
    let tail = '';
    while (ti < toc.length){ const t = toc[ti++]; tail += `<h2 class="lw-h l${t.l}" id="${esc(t.id)}">${esc(t.t)}</h2>`; }
    if (body.supp && body.supp.length){
      tail += `<details class="lw-supp" id="${esc(lawKey)}-supp"><summary>부칙 <span style="font-weight:400;color:var(--ink-3)">${body.supp.length}건</span></summary>` +
        body.supp.map(s => `<h3>${esc(s.t)}</h3>${s.b.map(([m, t]) => m && /^\d+(의\d+)?\.$/.test(m) ? `<p class="ho">${esc(m)} ${esc(t)}</p>` : (m && /^[가-힣]\.$/.test(m) ? `<p class="mok">${esc(m)} ${esc(t)}</p>` : `<p>${m && m !== 'X' && m !== 'N' && m !== 'T' ? esc(m) + ' ' : ''}${esc(t)}</p>`)).join('')}`).join('') + '</details>';
    }
    if (law.meta && law.meta.source) tail += `<p class="lw-src">출처: 국가법령정보센터 (${esc(law.meta.source)}) · 기준일 ${esc(law.meta.asof || '')}</p>`;
    return {pieces, tail};
  }
  function startText(textEl, law, body, lawKey){
    const {pieces, tail} = buildPieces(law, body, lawKey);
    const st = {pieces, i: 0, tail, token: {}};
    pending.set(textEl, st);
    let head = '';
    if (body.preamble) head += `<div class="pre"><h3>전문</h3>${body.preamble.split('\n').map(p => `<p>${esc(p)}</p>`).join('')}</div>`;
    if (!pieces.length) head += '<p class="lw-empty">조문이 없습니다.</p>';
    textEl.innerHTML = head;
    appendChunk(textEl, st, CHUNK);           // first chunk now
    const idle = window.requestIdleCallback || (cb => setTimeout(() => cb({timeRemaining: () => 8}), 16));
    const step = () => { if (pending.get(textEl) !== st) return; if (st.i >= st.pieces.length) return; appendChunk(textEl, st, CHUNK); if (st.i < st.pieces.length) idle(step); };
    if (st.i < st.pieces.length) idle(step);
  }
  function appendChunk(textEl, st, n){
    const end = Math.min(st.i + n, st.pieces.length);
    if (end > st.i){ textEl.insertAdjacentHTML('beforeend', st.pieces.slice(st.i, end).join('')); st.i = end; }
    if (st.i >= st.pieces.length && st.tail){ textEl.insertAdjacentHTML('beforeend', st.tail); st.tail = ''; }
  }
  function flush(textEl){ const st = pending.get(textEl); if (st) appendChunk(textEl, st, Infinity); }

  function tocHtml(body, lawKey){
    const toc = body.toc || [];
    if (!toc.length && !(body.supp && body.supp.length)) return '<p class="lw-empty" style="padding:12px 0;text-align:left">장·절 구분이 없는 법령입니다.</p>';
    // build nested tree from levels
    const root = {children: []}; const stack = [{node: root, l: 0}];
    toc.forEach(t => {
      const node = {t, children: []};
      while (stack.length > 1 && stack[stack.length - 1].l >= t.l) stack.pop();
      stack[stack.length - 1].node.children.push(node); stack.push({node, l: t.l});
    });
    const rec = (nodes, depth) => `<ul>${nodes.map(n => `<li class="l${n.t.l}${depth === 0 ? ' open' : ''}"><div class="row"><button type="button" class="tg${n.children.length ? '' : ' none'}" aria-label="펼치기">${CHEV}</button><a href="#${esc(n.t.id)}" data-h="${esc(n.t.id)}">${esc(n.t.t)}</a></div>${n.children.length ? rec(n.children, depth + 1) : ''}</li>`).join('')}</ul>`;
    let h = rec(root.children, 0);
    if (body.supp && body.supp.length) h += `<ul><li class="l1 supp"><div class="row"><span class="tg none"></span><a href="#${esc(lawKey)}-supp" data-h="${esc(lawKey)}-supp">부칙</a></div></li></ul>`;
    return h;
  }
  function headHtml(law, ver){
    const g = DATA.groups.find(x => x.id === law.group);
    const m = law.meta || {};
    let h = `<div class="kicker">${esc(g ? g.label : '')}${ver ? ' · ' + esc(ver.label) : (m.no ? ' · ' + esc(law.kind) + ' 제' + esc(m.no) + '호' : '')}</div><h1>${esc(law.name)}</h1>`;
    if (ver){

  const end = e => { if (!dragging) return; dragging = false; cs.classList.remove('dragging'); document.body.classList.remove('cs-drag'); const w = parseInt(cs.style.getPropertyValue('--sheet-w')) || 0; S.settings.sheetWidth = w; save('lawbook:settings', S.settings); };
  h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
  h.addEventListener('dblclick', () => { S.settings.sheetWidth = 0; save('lawbook:settings', S.settings); applySheetMode(); toast('기본 폭으로 되돌렸습니다'); });
})();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySettings);
$('#btnToc').addEventListener('click', () => openPanel(true));
$('#btnTocClose').addEventListener('click', () => openPanel(false));
$('#scrim').addEventListener('click', () => openPanel(false));
$('#btnSearch').addEventListener('click', () => openSearch(true));
$('#btnSet').addEventListener('click', () => openSet(true));
$('#btnBm').addEventListener('click', () => go(S.view === 'bookmarks' ? `#/${S.page}` : '#/bookmarks'));
$('#btnTheme').addEventListener('click', () => { const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); S.settings.theme = dark ? 'light' : 'dark'; applySettings(); });
$('#csBg').addEventListener('click', closeCase);
$('#btnCsClose').addEventListener('click', closeCase);
$('#btnCsX').addEventListener('click', closeCase);
$('#q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(runSearch, 150); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { const a = $('#results .res a'); if (a) { location.hash = a.getAttribute('href'); openSearch(false); } } });
document.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => { openSearch(false); openSet(false); }));
$('#sheet').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-close')) { openSet(false); return; }
  if (b.dataset.set) { S.settings[b.dataset.set] = b.dataset.v; applySettings(); $('#sheet').innerHTML = sheetHTML(); }
  if (b.dataset.font) { S.settings.font = Math.max(14, Math.min(20, S.settings.font + +b.dataset.font)); applySettings(); $('#sheet').innerHTML = sheetHTML(); }
});
document.addEventListener('click', e => {
  if (e.target.closest('[data-refresh-version]')) { location.reload(); return; }
  if (e.target.closest('[data-personal-export]')) { exportPersonal(); return; }
  if (e.target.closest('[data-personal-import]')) { $('#personalImport').click(); return; }
  const update = e.target.closest('[data-check-update]'); if (update) { updateData(update, false); return; }
  const download = e.target.closest('[data-download-offline]'); if (download) { updateData(download, true); return; }
  if (e.target.closest('[data-retry-full]')) { const c = byId.get(S.caseId); if (c) { delete c._fullTextError; setTab(2); } return; }
  const go_ = e.target.closest('[data-go]'); if (go_) { go(`#/${go_.dataset.go}`); return; }
  const bm = e.target.closest('[data-bm]'); if (bm) { e.preventDefault(); toggleBm(bm.dataset.bm); return; }
  /* 법률신문 주요판례: 연도 · 필터 · 찾기 */
  const yb = e.target.closest('[data-year]'); if (yb) { toggleYear(+yb.dataset.year, yb); return; }
  const afd = e.target.closest('[data-afield]');
  if (afd) { const A = S.annual, v = afd.dataset.afield; A.fields = v === 'all' ? [] : A.fields.includes(v) ? A.fields.filter(x => x !== v) : FIELDS.map(x => x.id).filter(id => id === v || A.fields.includes(id)); if (A.fields.length === FIELDS.length) A.fields = []; saveAnnual(); renderAnnual(); return; }
  const acr = e.target.closest('[data-acourt]'); if (acr) { S.annual.court = acr.dataset.acourt; saveAnnual(); renderAnnual(); return; }
  if (e.target.closest('[data-aenbanc]')) { S.annual.enbanc = !S.annual.enbanc; saveAnnual(); renderAnnual(); return; }
  if (e.target.closest('[data-areset]')) { Object.assign(S.annual, { fields: [], court: 'all', enbanc: false, q: '' }); const q = $('#aq'); if (q) q.value = ''; saveAnnual(); renderAnnual(); return; }
  if (e.target.closest('[data-ayears]')) { S.annual.years = YEARS.slice(); saveAnnual(); renderAnnual(); return; }
  if (e.target.closest('#btnAFilter')) { S.annual.open = !S.annual.open; renderAnnual(); return; }
  if (e.target.closest('#btnAFilterClose')) { S.annual.open = false; renderAnnual(); $('#btnAFilter').focus(); return; }
  if (e.target.closest('#btnAFind')) {
    const A = S.annual, open = !(A.find || A.q); A.find = open;
    if (!open) { A.q = ''; $('#aq').value = ''; }
    renderAnnual(); if (open) $('#aq').focus(); return;
  }
  /* 헌법재판소 주요결정·전원합의체: 선고연도 탭 */
  const ytb = e.target.closest('[data-ytab]'); if (ytb) { toggleYearTab(ytb.dataset.ytab, ytb); return; }
  const f = e.target.closest('[data-filter]'); if (f) { S.filter[S.page] = f.dataset.filter; renderedKey = null; render(!tabsOf(S.page).length); if (e.target.closest('#panelBody')) renderPanel(); return; }
  const tab = e.target.closest('[data-tab]'); if (tab) { setTab(+tab.dataset.tab); return; }
  if (e.target.closest('#btnCopy')) { copyCite(); return; }
  if (e.target.closest('#findPrev')) { jumpFind(-1); return; }
  if (e.target.closest('#findNext')) { jumpFind(1); return; }
  if (e.target.closest('#btnLawToc') || e.target.closest('#btnLawOutline')) { const ol = $('#lawOutline'); openLawOutline(!(ol && ol.classList.contains('pop'))); return; }
  if (e.target.closest('#btnFtOutline')) { const ol = $('#ftOutline'); const b = $('#btnFtOutline'); const on = !ol.classList.contains('pop'); ol.classList.toggle('pop', on); b.setAttribute('aria-expanded', String(on)); if (on) { const r = b.getBoundingClientRect(); ol.style.top = Math.round(r.bottom + 8) + 'px'; ol.style.right = Math.max(12, Math.round(window.innerWidth - r.right)) + 'px'; } return; }
  const fth = e.target.closest('[data-fth]'); if (fth) { e.preventDefault(); gotoFtHead(fth.dataset.fth); return; }
  if (!e.target.closest('.outline.pop')) { const lo = $('#lawOutline'); if (lo && lo.classList.contains('pop')) openLawOutline(false); const fo = $('#ftOutline'); if (fo && fo.classList.contains('pop')) { fo.classList.remove('pop'); const b = $('#btnFtOutline'); if (b) b.setAttribute('aria-expanded', 'false'); } }
  const law = e.target.closest('[data-law]'); if (law) { go(`#/laws/${law.dataset.law}`); return; }
  if (e.target.closest('#results a')) { openSearch(false); }
});
document.addEventListener('change', e => { if (e.target.id === 'lawSel') go(`#/laws/${e.target.value}`); if (e.target.id === 'personalImport') { importPersonal(e.target.files[0]); e.target.value = ''; } });
let aqTimer;
document.addEventListener('input', e => {
  if (e.target.id === 'emblemRange') { S.settings.emblem = +e.target.value; applySettings(); return; }
  if (e.target.id === 'aq') { S.annual.q = e.target.value; S.annual.find = true; clearTimeout(aqTimer); aqTimer = setTimeout(renderAnnual, 140); return; }   // 입력 중인 찾기 칸은 비워도 닫지 않는다
  if (e.target.id === 'memo') { const c = byId.get(S.caseId); if (!c) return; S.notes[recordKey(c)] = e.target.value; if (!e.target.value) delete S.notes[recordKey(c)]; save('lawbook:notes', S.notes); const st = $('#memoSt'); if (st) st.textContent = '저장됨'; const cnt = st && st.nextElementSibling; if (cnt) cnt.textContent = e.target.value.length + '자'; }
  if (e.target.id === 'find') { S.findQ = e.target.value; S.findIdx = -1; const c = byId.get(S.caseId); const panel = $('#tabpanel'); const box = $('#csBox'); const scroll = box.scrollTop; panel.innerHTML = fullHTML(c); const inp = $('#find'); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); box.scrollTop = scroll; fillFtOutline(); if (S.findQ.trim()) jumpFind(1); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#ovSearch').classList.contains('show') || $('#ovSet').classList.contains('show')) { openSearch(false); openSet(false); return; }
    if (e.target.id === 'aq' && e.target.value) { e.target.value = ''; S.annual.q = ''; renderAnnual(); return; }
    if ($('#panel').classList.contains('show')) { openPanel(false); return; }
    if (S.annual.open && !S.caseId && S.view === 'page' && S.page === 'annual') { S.annual.open = false; renderAnnual(); return; }
    const pop = document.querySelector('.outline.pop'); if (pop) { pop.classList.remove('pop'); document.querySelectorAll('#btnFtOutline,#btnLawOutline').forEach(b => b.setAttribute('aria-expanded', 'false')); return; }
    if (S.caseId) { closeCase(); } return;
  }
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.metaKey || e.ctrlKey || e.altKey) { if (e.key === 'Enter' && e.target.id === 'find') { jumpFind(e.shiftKey ? -1 : 1); } return; }
  if (e.key === '/') { e.preventDefault(); openSearch(true); return; }
  if (e.key === 't') { openPanel(!$('#panel').classList.contains('show')); return; }
  if (!S.caseId) return;
  if (e.key === 'f') { toggleFull(); return; }
  if (e.key === 'j' || e.key === 'ArrowRight') step(1);
  else if (e.key === 'k' || e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'b') toggleBm(S.caseId);
  else if (e.key >= '1' && e.key <= '4') setTab(+e.key);
});

applySettings();
parseHash();
render();
})().catch(error => {
  const col = document.getElementById('col');
  col.innerHTML = '<div class="empty-ft" role="alert"><p>판례집을 열지 못했습니다.</p><p id="bootError"></p><button type="button" id="bootRetry">다시 시도</button></div>';
  document.getElementById('bootError').textContent = error.message || String(error);
  document.getElementById('bootRetry').addEventListener('click', () => location.reload());
});
</script>
</body>
