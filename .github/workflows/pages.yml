name: Validate and deploy Casebook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_browser_checks:
        description: 'Run the full browser sweep and PWA checks (can take 45 minutes)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    outputs:
      data_version: ${{ steps.package.outputs.data_version }}
      shell_sha256: ${{ steps.package.outputs.shell_sha256 }}
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CASEBOOK_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install validation tools
        timeout-minutes: 5
        run: python -m pip install --retries 2 --timeout 30 -r requirements.txt
      - name: Verify preinstalled Chrome
        if: github.event_name == 'workflow_dispatch' && inputs.run_browser_checks
        run: google-chrome --version
      - name: Install Korean fonts for screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.run_browser_checks
        timeout-minutes: 3
        run: |
          install -d "$HOME/.local/share/fonts"
          curl --fail --location --retry 1 --connect-timeout 15 --max-time 60 \
            'https://raw.githubusercontent.com/google/fonts/e7db6ca603fd4862010383ff17ffd6cc4ffac1c0/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf' \
            --output "$HOME/.local/share/fonts/NotoSansKR.ttf"
          printf '%s  %s\n' '194018e6b2b293a7964f037b25c0249ce1418bc9ab3c971060a03aa57861e252' "$HOME/.local/share/fonts/NotoSansKR.ttf" | sha256sum --check
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match -f '%{family}\n' 'Noto Sans KR:lang=ko'
      - name: Test data rules and local server
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Validate and build both editions
        timeout-minutes: 5
        run: python tools/make.py validate data laws build web
      - name: Verify generated package hashes and references
        id: package
        timeout-minutes: 2
        run: |
          python tools/check_web_package.py output/web --registry data/registry.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json
          from pathlib import Path
          web = Path('output/web')
          print('data_version=' + json.loads((web / 'data-manifest.json').read_text())['version'])
          print('shell_sha256=' + hashlib.sha256((web / 'index.html').read_bytes()).hexdigest())
          PY
      - name: Run requested full browser checks
        if: github.event_name == 'workflow_dispatch' && inputs.run_browser_checks
        timeout-minutes: 45
        run: python tools/make.py check webcheck
      - name: Check list controls and responsive layout
        if: github.event_name == 'workflow_dispatch' && inputs.run_browser_checks
        timeout-minutes: 5
        run: python tools/test_layout.py output/casebook.html
      - name: Check typography and personal data
        run: |
          node tools/test_fulltext.cjs output/casebook.html
          node --test tools/test_web_data.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casebook-browser-checks
          path: shots/web-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload offline HTML
        uses: actions/upload-artifact@v4
        with:
          name: casebook-offline
          path: output/casebook.html
          retention-days: 30
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload public web artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/web
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published data and full text
        timeout-minutes: 2
        env:
          EXPECTED_DATA_VERSION: ${{ needs.build.outputs.data_version }}
          EXPECTED_SHELL_SHA256: ${{ needs.build.outputs.shell_sha256 }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time
          from collections import Counter
          from urllib.parse import urljoin, urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener
          base = 'https://wonki05.github.io/casebook/'
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError('Unexpected redirect from the public site')
          opener = build_opener(NoRedirect())
          def get(path):
              url = urljoin(base, path)
              parsed = urlsplit(url)
              if parsed.scheme != 'https' or parsed.netloc != 'wonki05.github.io' or not parsed.path.startswith('/casebook/'):
                  raise RuntimeError('Unexpected public asset location')
              request = Request(url, headers={'Cache-Control': 'no-cache'})
              with opener.open(request, timeout=10) as response:
                  raw = response.read(64 * 1024 * 1024 + 1)
              if len(raw) > 64 * 1024 * 1024:
                  raise RuntimeError('Published asset exceeds the smoke-test limit')
              return raw
          expected = os.environ['EXPECTED_DATA_VERSION']
          release = os.environ['RELEASE_SHA']
          for attempt in range(10):
              try:
                  manifest = json.loads(get('data-manifest.json?release=' + release))
                  shell = get('index.html?release=' + release)
                  if manifest['version'] != expected:
                      raise RuntimeError('Published data version is still ' + manifest['version'])
                  if hashlib.sha256(shell).hexdigest() != os.environ['EXPECTED_SHELL_SHA256']:
                      raise RuntimeError('Published reader shell is still an older release')
                  break
              except Exception:
                  if attempt == 9:
                      raise
                  time.sleep(2)
          def asset(ref):
              raw = get(ref['url'])
              if hashlib.sha256(raw).hexdigest() != ref['sha256']:
                  raise RuntimeError('Published asset hash mismatch: ' + ref['url'])
              return json.loads(raw)
          data = asset(manifest['cases'])
          if len(data['cases']) != manifest['caseCount']:
              raise RuntimeError('Published case count differs from the manifest')
          by_id = {case['id']: case for case in data['cases']}
          samples = ['std-civil-04', 'std-civil-122', 'std-civil-934']
          for case_id in samples:
              full = asset(by_id[case_id]['fullTextRef'])
              if not isinstance(full, list) or not any(block.get('text') for block in full):
                  raise RuntimeError('Published full text is empty: ' + case_id)
          civil = [case for case in data['cases'] if case['page'] == 'std-civil']
          print(json.dumps({'dataVersion': manifest['version'], 'caseCount': len(data['cases']),
                            'pages': dict(Counter(case['page'] for case in data['cases'])),
                            'civilFullTexts': sum(bool(case.get('fullTextRef')) for case in civil),
                            'sampleFullTextsVerified': samples, 'publishedShellVerified': True},
                           ensure_ascii=False))
          PY
